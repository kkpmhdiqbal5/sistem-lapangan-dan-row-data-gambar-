<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Rekap Data Admin - Sistem Lapangan</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body { background-color: #0b132b; color: #e0e6ed; font-family: 'Segoe UI', sans-serif; padding-bottom: 80px; }
    .navbar-dark-custom { background-color: #1c2541; border-bottom: 1px solid #2a385b; }
    .filter-card { background-color: #1c2541; border: 1px solid #2a385b; border-radius: 8px; }
    .form-control-dark, .form-select-dark { background-color: #0b132b; border: 1px solid #3a506b; color: #ffffff; font-size: 0.85rem; }
    .table-rekap { font-size: 0.8rem; color: #c0c0c0; vertical-align: middle; }
    .table-rekap th { background-color: #1c2541; color: #ffffff; border-bottom: 2px solid #3a506b; white-space: nowrap; }
    .table-rekap td { border-bottom: 1px solid #1f2d4d; white-space: nowrap; }
    .badge-sheet { background-color: #1d4ed8; color: #ffffff; font-size: 0.7rem; padding: 4px 8px; border-radius: 4px; }
    .btn-wa { background-color: #25d366; color: #ffffff; font-weight: 600; }
    
    /* BOTTOM NAVIGATION BAR DENGAN TOMBOL TENGAH MENCOLOK */
    .bottom-app-nav { 
      position: fixed; 
      bottom: 0; 
      left: 0; 
      right: 0; 
      background: #1c2541; 
      border-top: 1px solid #2a385b; 
      display: flex; 
      justify-content: space-around; 
      align-items: center;
      padding: 6px 0; 
      z-index: 1000; 
      height: 65px;
    }
    .nav-link-mobile { 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      text-decoration: none; 
      color: #94a3b8; 
      font-size: 0.7rem; 
      font-weight: 600; 
      flex: 1;
    }
    .nav-link-mobile.active { 
      color: #38bdf8; 
    }
    .nav-icon { 
      font-size: 1.2rem; 
      margin-bottom: 2px; 
    }

    /* Tombol Form Lapangan di Tengah yang Mencolok */
    .nav-link-center {
      position: relative;
      top: -12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
    }
    .nav-center-circle {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: white;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      box-shadow: 0 4px 15px rgba(34, 197, 94, 0.5);
      border: 3px solid #0b132b;
      transition: transform 0.2s;
    }
    .nav-link-center:active .nav-center-circle {
      transform: scale(0.95);
    }
    .nav-center-label {
      font-size: 0.7rem;
      font-weight: 700;
      color: #22c55e;
      margin-top: 2px;
    }
  </style>
</head>
<body>

  <!-- NAVBAR UTAMA -->
  <nav class="navbar navbar-dark-custom px-3 py-2 mb-3">
    <div class="container-fluid p-0 d-flex justify-content-between align-items-center">
      <span class="fs-5 fw-bold text-white">📊 Panel Rekap Data Admin</span>
      <button onclick="logout()" class="btn btn-danger btn-sm fw-bold">🚪 Keluar</button>
    </div>
  </nav>

  <div class="container-fluid px-3 mb-5">
    <!-- FILTER CARD -->
    <div class="filter-card p-3 mb-3">
      <div class="row g-2">
        <div class="col-md-3">
          <label class="form-label small text-secondary fw-bold mb-1">PILIH SUMBER SHEET</label>
          <select id="filterSheet" class="form-select form-select-dark" onchange="applyFilters()">
            <option value="ALL">Semua Sheet</option>
            <option value="MENUNGGU DIAMBIL">MENUNGGU DIAMBIL</option>
            <option value="SUDAH DIAMBIL">SUDAH DIAMBIL</option>
          </select>
        </div>
        <div class="col-md-3">
          <label class="form-label small text-secondary fw-bold mb-1">KRITERIA CARI</label>
          <select id="filterKriteria" class="form-select form-select-dark" onchange="applyFilters()">
            <option value="ALL">Semua Kriteria</option>
            <option value="CID">CID / NAMA</option>
            <option value="ODP">ODP</option>
            <option value="POP">POP</option>
            <option value="PERANGKAT">PERANGKAT (SN & P-SN)</option>
          </select>
        </div>
        <div class="col-md-3">
          <label class="form-label small text-secondary fw-bold mb-1">TANGGAL</label>
          <input type="date" id="filterTanggal" class="form-control form-control-dark" onchange="applyFilters()">
        </div>
        <div class="col-md-3">
          <label class="form-label small text-secondary fw-bold mb-1">KATA KUNCI / SCAN</label>
          <div class="input-group input-group-sm">
            <input type="text" id="filterSearch" class="form-control form-control-dark" placeholder="Ketik CID, Nama, SN..." oninput="applyFilters()">
            <button type="button" class="btn btn-info text-white fw-bold" onclick="startScanner()">📷 SCAN</button>
          </div>
        </div>
      </div>

      <div class="d-flex justify-content-between align-items-center mt-3 pt-2 border-top border-secondary">
        <div class="small">Total Hasil: <span id="totalDataCount" class="fw-bold text-info">0</span> Data</div>
        <div class="d-flex gap-2">
          <button onclick="sendSelectedToWA()" class="btn btn-wa btn-sm px-3">💬 Kirim Gabungan (WA)</button>
          <button onclick="loadData()" class="btn btn-primary btn-sm px-3">🔄 Refresh</button>
        </div>
      </div>
    </div>

    <!-- TABEL DATA -->
    <div class="table-responsive">
      <table class="table table-rekap align-middle">
        <thead>
          <tr>
            <th><input type="checkbox" id="checkAll" onclick="toggleCheckAll(this)"></th>
            <th>SHEET</th><th>WAKTU</th><th>ODP</th><th>POP</th><th>CID / NAMA</th>
            <th>SN / P-SN</th><th>PAKET</th><th>NO HP</th><th>SHERLOCK</th><th>SALES</th><th>KET</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr><td colspan="12" class="text-center py-4 text-secondary">Memuat data rekap admin...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- BOTTOM NAVIGATION BAR (Tombol Form Lapangan di Tengah & Mencolok) -->
  <div class="bottom-app-nav">
    <a href="search.html" class="nav-link-mobile">
      <div class="nav-icon">🔍</div><span>Cari</span>
    </a>
    
    <a href="admin.html" class="nav-link-mobile active">
      <div class="nav-icon">💻</div><span>Perangkat</span>
    </a>

    <!-- Tombol Form Lapangan di Tengah & Paling Mencolok -->
    <a href="index.html" class="nav-link-center">
      <div class="nav-center-circle">📝</div>
      <span class="nav-center-label">Form Lapangan</span>
    </a>

    <a href="laporan.html" class="nav-link-mobile">
      <div class="nav-icon">📊</div><span>Laporan</span>
    </a>
  </div>

  <!-- MODAL SCANNER -->
  <div id="scannerModal" class="modal fade" tabindex="-1" data-bs-backdrop="static">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content bg-dark text-white">
        <div class="modal-header border-secondary">
          <h6 class="modal-title text-info">Scan Barcode</h6>
          <button type="button" class="btn-close btn-close-white" onclick="stopScanner()"></button>
        </div>
        <div class="modal-body p-2"><div id="reader" style="width: 100%;"></div></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyHOXnA4YsBeNdPDUxXwPlsJHPJo7k7E4IqItpNOKLjfsYeQce7a9Gda8p-3p-Ys6tJkg/exec";
    let rawDataList = [];
    let filteredDataList = [];
    let html5QrCode = null;

    window.onload = function() { checkAuth(); loadData(); };
    function checkAuth() { if (!localStorage.getItem("user_session")) window.location.href = "login.html"; }

    function loadData() {
      fetch(`${SCRIPT_URL}?action=getDataAdmin`).then(r => r.json()).then(res => {
        if (res.status === "success") { 
          rawDataList = res.data; 
          applyFilters(); 
        }
      });
    }

    function applyFilters() {
      const sheetVal = document.getElementById('filterSheet').value;
      const searchVal = document.getElementById('filterSearch').value.toLowerCase();

      filteredDataList = rawDataList.filter(row => {
        let matchSheet = (sheetVal === "ALL") || (row.sumber_sheet === sheetVal);
        let matchSearch = !searchVal || (
          row.nama_lama?.toLowerCase().includes(searchVal) || 
          row.cid_lama?.toLowerCase().includes(searchVal) || 
          row.odp?.toLowerCase().includes(searchVal) || 
          row.sn?.toLowerCase().includes(searchVal)
        );
        return matchSheet && matchSearch;
      });
      renderTable(filteredDataList);
    }

    function renderTable(data) {
      document.getElementById('totalDataCount').innerText = data.length;
      const tbody = document.getElementById('tableBody');
      if (data.length === 0) { 
        tbody.innerHTML = '<tr><td colspan="12" class="text-center py-4 text-secondary">Tidak ada data.</td></tr>'; 
        return; 
      }
      
      tbody.innerHTML = data.map((row, index) => `
        <tr>
          <td><input type="checkbox" class="row-checkbox" data-index="${index}"></td>
          <td><span class="badge badge-sheet">${row.sumber_sheet}</span></td>
          <td>${row.timestamp || '-'}</td>
          <td class="text-info fw-bold">${row.odp || '-'}</td>
          <td>${row.pop || '-'}</td>
          <td><div class="fw-bold text-white">${row.nama_lama || '-'}</div><div class="small text-secondary">CID: ${row.cid_lama || '-'}</div></td>
          <td><div class="text-success fw-bold">SN: ${row.sn || '-'}</div></td>
          <td>${row.paket || '-'}</td>
          <td>${row.nohp || '-'}</td>
          <td>${row.sherlock ? `<a href="https://www.google.com/maps?q=${row.sherlock}" target="_blank" class="text-info">📍 Maps</a>` : '-'}</td>
          <td>${row.sales || '-'}</td>
          <td>${row.keterangan || '-'}</td>
        </tr>
      `).join('');
    }

    function startScanner() {
      new bootstrap.Modal(document.getElementById('scannerModal')).show();
      html5QrCode = new Html5Qrcode("reader");
      html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, msg => {
        document.getElementById('filterSearch').value = msg; 
        applyFilters(); 
        stopScanner();
      });
    }

    function stopScanner() { 
      if (html5QrCode) {
        html5QrCode.stop().then(() => { 
          html5QrCode.clear(); 
          bootstrap.Modal.getInstance(document.getElementById('scannerModal'))?.hide(); 
        }); 
      } 
    }

    function toggleCheckAll(src) { 
      document.querySelectorAll('.row-checkbox').forEach(cb => cb.checked = src.checked); 
    }

    function sendSelectedToWA() {
      const selected = document.querySelectorAll('.row-checkbox:checked');
      if (selected.length === 0) { alert("Pilih minimal satu data!"); return; }
      
      let textMsg = `📋 *REKAP GABUNGAN (${selected.length} DATA LAPANGAN)*\n====================================\n\n`;
      selected.forEach((box, i) => {
        const item = filteredDataList[box.getAttribute('data-index')];
        if (item) {
          textMsg += `*${i+1}. ${item.nama_lama || '-'}*\n` +
                     `* ODP: ${item.odp || '-'}\n` +
                     `* POP: ${item.pop || '-'}\n` +
                     `* CID: ${item.cid_lama || '-'}\n` +
                     `* SN: ${item.sn || '-'}\n` +
                     `* Sheet: ${item.sumber_sheet}\n` +
                     `* Ket: ${item.keterangan || '-'}\n` +
                     `📍 Sherlock: ${item.sherlock ? 'https://www.google.com/maps?q=' + item.sherlock : '-'}\n` +
                     `🖼️ Foto Rumah: -\n` +
                     `🖼️ Foto Alat: -\n\n`;
        }
      });
      window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(textMsg)}`, '_blank');
    }

    function logout() { localStorage.removeItem("user_session"); window.location.href = "login.html"; }
  </script>
</body>
</html>
