<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Rekap Data Admin - Sistem Lapangan</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #0b132b;
      color: #e0e6ed;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .navbar-dark-custom {
      background-color: #1c2541;
      border-bottom: 1px solid #2a385b;
    }
    .filter-card {
      background-color: #1c2541;
      border: 1px solid #2a385b;
      border-radius: 8px;
    }
    .form-control-dark, .form-select-dark {
      background-color: #0b132b;
      border: 1px solid #3a506b;
      color: #ffffff;
      font-size: 0.85rem;
    }
    .form-control-dark:focus, .form-select-dark:focus {
      background-color: #0b132b;
      border-color: #48cae4;
      color: #ffffff;
      box-shadow: 0 0 0 0.2rem rgba(72, 202, 228, 0.25);
    }
    .table-rekap {
      font-size: 0.8rem;
      color: #c0c0c0;
      vertical-align: middle;
    }
    .table-rekap th {
      background-color: #1c2541;
      color: #ffffff;
      border-bottom: 2px solid #3a506b;
      white-space: nowrap;
    }
    .table-rekap td {
      border-bottom: 1px solid #1f2d4d;
      white-space: nowrap;
    }
    .badge-sheet {
      background-color: #1d4ed8;
      color: #ffffff;
      font-size: 0.7rem;
      padding: 4px 8px;
      border-radius: 4px;
    }
    .btn-wa {
      background-color: #25d366;
      color: #ffffff;
      font-weight: 600;
    }
    .btn-wa:hover {
      background-color: #1eb857;
      color: #ffffff;
    }
  </style>
</head>
<body>

  <!-- NAVBAR UTAMA -->
  <nav class="navbar navbar-dark-custom px-3 py-2 mb-3">
    <div class="container-fluid p-0 d-flex justify-content-between align-items-center">
      <span class="fs-5 fw-bold text-white d-flex align-items-center gap-2">
        📊 Panel Rekap Data Admin
      </span>
      <div class="d-flex gap-2">
        <a href="index.html" class="btn btn-outline-light btn-sm fw-bold">Form Lapangan</a>
        <a href="admin.html" class="btn btn-primary btn-sm fw-bold">Dashboard Admin</a>
        <button onclick="logout()" class="btn btn-danger btn-sm fw-bold">🚪 Keluar</button>
      </div>
    </div>
  </nav>

  <div class="container-fluid px-3">
    
    <!-- CARD FILTER -->
    <div class="filter-card p-3 mb-3">
      <div class="row g-2">
        <div class="col-md-3">
          <label class="form-label small text-secondary fw-bold mb-1">PILIH SUMBER SHEET</label>
          <select id="filterSheet" class="form-select form-select-dark" onchange="applyFilters()">
            <option value="ALL">Semua Sheet</option>
            <option value="MENUNGGU DIAMBIL">MENUNGGU DIAMBIL</option>
            <option value="SUDAH DIAMBIL">SUDAH DIAMBIL</option>
          </select>
        </div>
        <div class="col-md-3">
          <label class="form-label small text-secondary fw-bold mb-1">KRITERIA CARI</label>
          <select id="filterKriteria" class="form-select form-select-dark" onchange="applyFilters()">
            <option value="ALL">Semua Kriteria</option>
            <option value="CID">CID / NAMA</option>
            <option value="ODP">ODP</option>
            <option value="POP">POP</option>
          </select>
        </div>
        <div class="col-md-3">
          <label class="form-label small text-secondary fw-bold mb-1">CARI BERDASARKAN TANGGAL</label>
          <input type="date" id="filterTanggal" class="form-control form-control-dark" onchange="applyFilters()">
        </div>
        <div class="col-md-3">
          <label class="form-label small text-secondary fw-bold mb-1">KATA KUNCI / SCAN</label>
          <input type="text" id="filterSearch" class="form-control form-control-dark" placeholder="Ketik CID, Nama, SN, ODP..." oninput="applyFilters()">
        </div>
      </div>

      <div class="d-flex justify-content-between align-items-center mt-3 pt-2 border-top border-secondary">
        <div class="small">
          Total Hasil: <span id="totalDataCount" class="fw-bold text-info">0</span> Data 
          <a href="#" onclick="resetFilters()" class="text-secondary ms-2 text-decoration-none">Reset Filter</a>
        </div>
        <div class="d-flex gap-2">
          <button onclick="sendSelectedToWA()" class="btn btn-wa btn-sm px-3 d-flex align-items-center gap-1">
            💬 Kirim Gabungan (WA)
          </button>
          <button onclick="loadData()" class="btn btn-primary btn-sm px-3">
            🔄 Refresh
          </button>
        </div>
      </div>
    </div>

    <!-- TABEL REKAP DATA -->
    <div class="table-responsive">
      <table class="table table-rekap align-middle">
        <thead>
          <tr>
            <th><input type="checkbox" id="checkAll" onclick="toggleCheckAll(this)"></th>
            <th>SHEET</th>
            <th>WAKTU / TANGGAL</th>
            <th>ODP</th>
            <th>POP</th>
            <th>CID / NAMA</th>
            <th>PAKET</th>
            <th>NO HP</th>
            <th>SHERLOCK</th>
            <th>SALES</th>
            <th>KET / KENDALA</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr><td colspan="11" class="text-center py-4 text-secondary">Memuat data rekap admin...</td></tr>
        </tbody>
      </table>
    </div>

  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxlG.../exec";
    let rawDataList = [];

    window.onload = function() {
      checkAuth();
      loadData();
    };

    function checkAuth() {
      if (!localStorage.getItem("user_session")) {
        window.location.href = "login.html";
      }
    }

    function loadData() {
      document.getElementById('tableBody').innerHTML = '<tr><td colspan="11" class="text-center py-4 text-secondary">Memuat data dari Google Sheets...</td></tr>';
      
      fetch(`${SCRIPT_URL}?action=getDataAdmin`)
        .then(r => r.json())
        .then(res => {
          if (res.status === "success") {
            rawDataList = res.data;
            applyFilters();
          } else {
            document.getElementById('tableBody').innerHTML = `<tr><td colspan="11" class="text-center text-danger py-4">${res.message}</td></tr>`;
          }
        })
        .catch(err => {
          document.getElementById('tableBody').innerHTML = '<tr><td colspan="11" class="text-center text-danger py-4">Gagal mengambil data dari server.</td></tr>';
        });
    }

    function applyFilters() {
      const sheetVal = document.getElementById('filterSheet').value;
      const tanggalVal = document.getElementById('filterTanggal').value;
      const searchVal = document.getElementById('filterSearch').value.toLowerCase();

      let filtered = rawDataList.filter(row => {
        let matchSheet = (sheetVal === "ALL") || (row.sumber_sheet === sheetVal);
        let matchSearch = !searchVal || 
          (row.nama_lama && row.nama_lama.toLowerCase().includes(searchVal)) ||
          (row.cid_lama && row.cid_lama.toLowerCase().includes(searchVal)) ||
          (row.odp && row.odp.toLowerCase().includes(searchVal)) ||
          (row.pop && row.pop.toLowerCase().includes(searchVal));

        let matchTanggal = true;
        if (tanggalVal && row.timestamp) {
          matchTanggal = row.timestamp.startsWith(tanggalVal);
        }

        return matchSheet && matchSearch && matchTanggal;
      });

      renderTable(filtered);
    }

    function renderTable(data) {
      document.getElementById('totalDataCount').innerText = data.length;
      const tbody = document.getElementById('tableBody');

      if (data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="11" class="text-center py-4 text-secondary">Tidak ada data ditemukan.</td></tr>';
        return;
      }

      tbody.innerHTML = data.map((row, index) => `
        <tr>
          <td><input type="checkbox" class="row-checkbox" data-index="${index}"></td>
          <td><span class="badge badge-sheet">${row.sumber_sheet}</span></td>
          <td>${row.timestamp || '-'}</td>
          <td class="text-info fw-bold">${row.odp || '-'}</td>
          <td>${row.pop || '-'}</td>
          <td>
            <div class="fw-bold text-white">${row.nama_lama || '-'}</div>
            <div class="small text-secondary">CID: ${row.cid_lama || '-'}</div>
          </td>
          <td>${row.paket || '-'}</td>
          <td>${row.nohp || '-'}</td>
          <td>
            ${row.sherlock ? `<a href="https://www.google.com/maps?q=${row.sherlock}" target="_blank" class="text-info text-decoration-none">📍 Maps</a>` : '-'}
          </td>
          <td>${row.sales || '-'}</td>
          <td>${row.keterangan || '-'}</td>
        </tr>
      `).join('');
    }

    function toggleCheckAll(source) {
      checkboxes = document.getElementsByClassName('row-checkbox');
      for (var i = 0, n = checkboxes.length; i < n; i++) {
        checkboxes[i].checked = source.checked;
      }
    }

    function resetFilters() {
      document.getElementById('filterSheet').value = "ALL";
      document.getElementById('filterKriteria').value = "ALL";
      document.getElementById('filterTanggal').value = "";
      document.getElementById('filterSearch').value = "";
      applyFilters();
    }

    function sendSelectedToWA() {
      const selectedBoxes = document.querySelectorAll('.row-checkbox:checked');
      if (selectedBoxes.length === 0) {
        alert("Pilih setidaknya satu baris data untuk dikirim ke WA!");
        return;
      }

      let textMsg = "*REKAP DATA KLIEN*\n\n";
      selectedBoxes.forEach(box => {
        const idx = box.getAttribute('data-index');
        const item = rawDataList[idx];
        textMsg += `📌 *${item.nama_lama}* (${item.cid_lama})\nODP: ${item.odp} | POP: ${item.pop}\n\n`;
      });

      window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(textMsg)}`, '_blank');
    }

    function logout() {
      localStorage.removeItem("user_session");
      window.location.href = "login.html";
    }
  </script>
</body>
</html>
