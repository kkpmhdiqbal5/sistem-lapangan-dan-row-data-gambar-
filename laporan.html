<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laporan & Sistem Input - Sistem Lapangan</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Pustaka Mammoth.js untuk membaca file .docx -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
  <style>
    body { background-color: #0b132b; color: #e0e6ed; font-family: 'Segoe UI', sans-serif; padding-bottom: 85px; }
    .top-bar { background-color: #1c2541; padding: 14px 20px; border-bottom: 1px solid #2a385b; }
    .card-custom { background-color: #1c2541; border: 1px solid #2a385b; border-radius: 12px; }
    .form-control-dark { background-color: #0b132b; border: 1px solid #3a506b; color: #ffffff; font-size: 0.85rem; }
    
    /* BOTTOM NAVIGATION BAR */
    .bottom-app-nav { 
      position: fixed; bottom: 0; left: 0; right: 0; 
      background: #1c2541; border-top: 1px solid #2a385b; 
      display: flex; justify-content: space-around; align-items: center;
      padding: 6px 0; z-index: 1000; height: 65px;
    }
    .nav-link-mobile { display: flex; flex-direction: column; align-items: center; text-decoration: none; color: #94a3b8; font-size: 0.7rem; font-weight: 600; flex: 1; }
    .nav-link-mobile.active { color: #38bdf8; }
    .nav-icon { font-size: 1.2rem; margin-bottom: 2px; }

    .nav-link-center { position: relative; top: -12px; display: flex; flex-direction: column; align-items: center; text-decoration: none; }
    .nav-center-circle {
      background: linear-gradient(135deg, #22c55e, #16a34a); color: white;
      width: 50px; height: 50px; border-radius: 50%; display: flex;
      align-items: center; justify-content: center; font-size: 1.5rem;
      box-shadow: 0 4px 15px rgba(34, 197, 94, 0.5); border: 3px solid #0b132b;
    }
    .nav-center-label { font-size: 0.7rem; font-weight: 700; color: #22c55e; margin-top: 2px; }
  </style>
</head>
<body>

  <div class="top-bar d-flex justify-content-between align-items-center mb-4">
    <div class="fw-bold fs-5 text-white">📊 Pusat Laporan & Sistem Input</div>
    <button onclick="logout()" class="btn btn-danger btn-sm fw-bold">🚪 Keluar</button>
  </div>

  <div class="container px-3">
    <!-- Menu Utama -->
    <div id="menuUtama" class="row g-3">
      <div class="col-12">
        <button onclick="bukaForm('input')" class="btn btn-success w-100 py-3 fw-bold shadow-sm fs-6">
          📥 Input Data (File / Teks Manual)
        </button>
      </div>
      <div class="col-12">
        <button onclick="bukaForm('hapus')" class="btn btn-danger w-100 py-3 fw-bold shadow-sm fs-6">
          🗑 LAPORAN (Hapus & Arsip)
        </button>
      </div>
    </div>

    <!-- Form Input Massal & File -->
    <div id="formInputMassal" class="card-custom p-3 d-none mt-2">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <h6 class="text-success fw-bold m-0">📥 Form Input Data (.txt / .docx / Manual)</h6>
        <button onclick="tutupForm()" class="btn btn-sm btn-outline-light py-0 px-2">✕ Tutup</button>
      </div>
      
      <!-- Upload File -->
      <div class="mb-3">
        <label class="form-label small text-info fw-bold">Pilih File (.txt atau .docx):</label>
        <input type="file" id="fileInput" class="form-control form-control-dark" accept=".txt,.docx" onchange="bacaFile(event)">
      </div>

      <div class="text-center small text-muted mb-2">- ATAU TEMPEL TEKS MANUAL DI BAWAH -</div>

      <!-- Textarea Manual -->
      <textarea id="teksMassal" class="form-control form-control-dark font-monospace mb-3" rows="5" placeholder="Nama : ...&#10;CID : ...&#10;ODP : ..."></textarea>
      
      <button onclick="eksekusiInputMassal()" id="btnInputMassal" class="btn btn-success btn-sm w-100 fw-bold py-2">Proses Input Data</button>
    </div>

    <!-- Form Hapus & Arsip -->
    <div id="formHapusArsip" class="card-custom p-3 d-none mt-2">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <h6 class="text-danger fw-bold m-0">🗑 Form Hapus & Arsip Selektif</h6>
        <button onclick="tutupForm()" class="btn btn-sm btn-outline-light py-0 px-2">✕ Tutup</button>
      </div>
      <p class="small text-muted mb-2">Tempel daftar CID atau nama yang ingin dihapus dan diarsipkan otomatis:</p>
      <textarea id="listCidHapus" class="form-control form-control-dark font-monospace mb-3" rows="5" placeholder="Tempel CID atau format laporan WA di sini..."></textarea>
      <button onclick="eksekusiHapusArsip()" id="btnHapusArsip" class="btn btn-danger btn-sm w-100 fw-bold py-2">Eksekusi Hapus & Arsip</button>
    </div>
  </div>

  <!-- BOTTOM NAVIGATION BAR -->
  <div class="bottom-app-nav">
    <a href="search.html" class="nav-link-mobile">
      <div class="nav-icon">🔍</div><span>Cari</span>
    </a>
    <a href="admin.html" class="nav-link-mobile">
      <div class="nav-icon">💻</div><span>Perangkat</span>
    </a>
    <a href="index.html" class="nav-link-center">
      <div class="nav-center-circle">📝</div>
      <span class="nav-center-label">Form Lapangan</span>
    </a>
    <a href="laporan.html" class="nav-link-mobile active">
      <div class="nav-icon">📊</div><span>Laporan</span>
    </a>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzsS4-LPktyuUKoC6Cf6TERV498wqvm31frvD7-W0gFhrCb9fkgwVBjAHeLrEeVMd25/exec";

    function bukaForm(jenis) {
      document.getElementById('menuUtama').classList.add('d-none');
      document.getElementById('formInputMassal').classList.add('d-none');
      document.getElementById('formHapusArsip').classList.add('d-none');

      if (jenis === 'input') {
        document.getElementById('formInputMassal').classList.remove('d-none');
      } else if (jenis === 'hapus') {
        document.getElementById('formHapusArsip').classList.remove('d-none');
      }
    }

    function tutupForm() {
      document.getElementById('formInputMassal').classList.add('d-none');
      document.getElementById('formHapusArsip').classList.add('d-none');
      document.getElementById('menuUtama').classList.remove('d-none');
    }

    // Pembaca File Otomatis (.txt / .docx)
    function bacaFile(event) {
      const file = event.target.files[0];
      if (!file) return;

      const fileName = file.name.toLowerCase();

      if (fileName.endsWith('.txt')) {
        const reader = new FileReader();
        reader.onload = function(e) {
          document.getElementById('teksMassal').value = e.target.result;
        };
        reader.readAsText(file);
      } 
      else if (fileName.endsWith('.docx')) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const arrayBuffer = e.target.result;
          mammoth.extractRawText({ arrayBuffer: arrayBuffer })
            .then(function(result) {
              document.getElementById('teksMassal').value = result.value;
            })
            .catch(function(err) {
              alert("Gagal membaca file Word (.docx): " + err);
            });
        };
        reader.readAsArrayBuffer(file);
      } else {
        alert("Format file tidak didukung! Harap gunakan .txt atau .docx");
      }
    }

    function eksekusiInputMassal() {
      const teks = document.getElementById('teksMassal').value;
      if (!teks) { alert("Teks atau file input masih kosong!"); return; }
      
      const btn = document.getElementById('btnInputMassal');
      btn.disabled = true; 
      btn.innerText = "Memproses...";

      fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify({ action: "inputMassalFile", teks: teks })
      })
      .then(r => r.json())
      .then(res => {
        alert(res.message);
        if(res.status === "success") {
          document.getElementById('teksMassal').value = "";
          document.getElementById('fileInput').value = "";
          tutupForm();
        }
      })
      .catch(err => {
        alert("Gagal terhubung ke server.");
        console.error(err);
      })
      .finally(() => { 
        btn.disabled = false; 
        btn.innerText = "Proses Input Data"; 
      });
    }

function eksekusiHapusArsip() {
      const teksCid = document.getElementById('listCidHapus').value;
      if (!teksCid) { alert("Teks rekap laporan masih kosong!"); return; }
      if (!confirm("Yakin ingin memproses penghapusan & pengarsipan data ini?")) return;

      const btn = document.getElementById('btnHapusArsip');
      btn.disabled = true; 
      btn.innerText = "Memproses...";

      fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify({ action: "hapusArsipSelektif", teksCid: teksCid })
      })
      .then(r => r.json())
      .then(res => {
        alert(res.message);
        if(res.status === "success") {
          document.getElementById('listCidHapus').value = "";
          tutupForm();
        }
      })
      .catch(err => {
        alert("Gagal terhubung ke server.");
        console.error(err);
      })
      .finally(() => { 
        btn.disabled = false; 
        btn.innerText = "Eksekusi Hapus & Arsip"; 
      });
    }

    function logout() { localStorage.removeItem("user_session"); window.location.href = "login.html"; }
  </script>
</body>
</html>
