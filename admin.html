<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manajemen User - Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #0f172a;
      color: #e2e8f0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .card-custom {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
    }
    .table-dark-custom {
      background-color: #1e293b;
      color: #e2e8f0;
    }
    .table-dark-custom th {
      background-color: #334155;
      color: #38bdf8;
    }
  </style>
</head>
<body class="p-3 p-md-4">

  <!-- SCRIPT PROTEKSI SESSION (Harus berjalan paling awal sebelum render body) -->
  <script>
    (function checkAuth() {
      const sessionData = localStorage.getItem("user_session");
      if (!sessionData) {
        alert("Akses Ditolak! Silakan login terlebih dahulu.");
        window.location.href = "login.html";
      }
    })();
  </script>

  <div class="container" style="max-width: 960px;">
    <!-- HEADER & NAVIGASI ADMIN -->
    <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom border-secondary">
      <div>
        <h4 class="text-info m-0 fw-bold">👥 Manajemen Pengguna & Hak Akses</h4>
        <small class="text-muted">Logged in as: <strong id="currentUser" class="text-white">-</strong></small>
      </div>
      <div class="d-flex gap-2">
        <a href="search.html" class="btn btn-outline-info btn-sm">📋 Rekap Data</a>
        <a href="index.html" class="btn btn-outline-light btn-sm">📝 Form Lapangan</a>
        <button onclick="logout()" class="btn btn-danger btn-sm fw-bold">Logout 🚪</button>
      </div>
    </div>

    <!-- TABEL MANAJEMEN USER -->
    <div class="card-custom p-3 table-responsive">
      <table class="table table-dark-custom table-hover align-middle small m-0">
        <thead>
          <tr>
            <th>Username</th>
            <th>Role</th>
            <th>Akses Dashboard</th>
            <th>Akses Form Input</th>
            <th>Akses Data Admin</th>
            <th>Akses Manage Users</th>
          </tr>
        </thead>
        <tbody id="userTableBody">
          <tr><td colspan="6" class="text-center py-4 text-muted">Memuat data akun pengguna...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // URL Web App Google Apps Script Anda
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxlG.../exec";

    window.onload = function() {
      const session = JSON.parse(localStorage.getItem("user_session") || "{}");
      if (session.username) {
        document.getElementById("currentUser").innerText = `${session.username} (${session.role})`;
      }
      loadUsers();
    };

    function loadUsers() {
      fetch(`${SCRIPT_URL}?action=getUsers`)
        .then(r => r.json())
        .then(res => {
          if (res.status === "success") {
            const body = document.getElementById('userTableBody');
            if (!res.data || res.data.length === 0) {
              body.innerHTML = '<tr><td colspan="6" class="text-center py-3">Tidak ada data akun.</td></tr>';
              return;
            }
            body.innerHTML = res.data.map(u => `
              <tr>
                <td class="fw-bold text-info">${u.username}</td>
                <td><span class="badge bg-secondary">${u.role}</span></td>
                <td>${u.can_dashboard ? '✅' : '❌'}</td>
                <td>${u.can_input ? '✅' : '❌'}</td>
                <td>${u.can_data_admin ? '✅' : '❌'}</td>
                <td>${u.can_manage_users ? '✅' : '❌'}</td>
              </tr>
            `).join('');
          }
        })
        .catch(err => {
          document.getElementById('userTableBody').innerHTML = '<tr><td colspan="6" class="text-center text-danger py-3">Gagal mengambil data pengguna!</td></tr>';
        });
    }

    function logout() {
      if (confirm("Apakah Anda yakin ingin keluar?")) {
        localStorage.removeItem("user_session");
        window.location.href = "login.html";
      }
    }
  </script>
</body>
</html>
