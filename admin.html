<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Info Perangkat - Sistem Lapangan</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f1f5f9; font-family: 'Segoe UI', sans-serif; padding-bottom: 70px; }
    .top-bar { background-color: #0f172a; color: #ffffff; padding: 12px 20px; }
    .card-custom { background-color: #ffffff; border-radius: 8px; border: 1px solid #e2e8f0; }
    .card-header-dark { background-color: #0f172a; color: #ffffff; padding: 10px 15px; border-top-left-radius: 8px; border-top-right-radius: 8px; }
    .table-custom { font-size: 0.75rem; vertical-align: middle; }
    .table-custom th { background-color: #0f172a; color: #ffffff; white-space: nowrap; }
    
    /* BOTTOM NAVIGATION BAR SERAGAM */
    .bottom-app-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #0f172a; border-top: 1px solid #1e293b; display: flex; justify-content: space-around; padding: 10px 0 12px 0; z-index: 1000; }
    .nav-link-mobile { display: flex; flex-direction: column; align-items: center; text-decoration: none; color: #94a3b8; font-size: 0.72rem; font-weight: 600; }
    .nav-link-mobile.active { color: #38bdf8; }
    .nav-icon { font-size: 1.25rem; margin-bottom: 2px; }
  </style>
</head>
<body>

  <!-- TOP BAR -->
  <div class="top-bar d-flex justify-content-between align-items-center">
    <div class="fw-bold fs-6">💻 Info Perangkat</div>
    <div class="d-flex align-items-center gap-2">
    
      <span class="badge bg-success">● Online</span>
    </div>
  </div>

  <div class="container my-3 mb-5" style="max-width: 1000px;">
    <div class="card-custom p-3 mb-3">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <h6 class="fw-bold m-0 text-primary">⚙ Data Info Perangkat Lapangan</h6>
        <button onclick="loadPerangkatData()" class="btn btn-sm text-white fw-bold" style="background-color: #10b981;">🔄 Muat Data</button>
      </div>
      <input type="text" id="searchPerangkat" class="form-control form-control-sm" placeholder="Ketik kata kunci pencarian..." oninput="filterPerangkat()">
    </div>

    <div class="card-custom">
      <div class="card-header-dark d-flex justify-content-between align-items-center">
        <span class="fw-bold small">🗄 Daftar Perangkat Terdata</span>
        <span id="badgeTotal" class="badge bg-info text-dark fw-bold">0 Data</span>
      </div>
      <div class="table-responsive p-2" style="max-height: 420px; overflow-y: auto;">
        <table class="table table-bordered table-custom m-0 align-middle text-center">
          <thead>
            <tr>
              <th>WAKTU</th><th>POP</th><th>ODP</th><th>CID LAMA</th><th>NAMA LAMA</th>
              <th>SN UNIT</th><th>P-SN</th><th>FOTO RUMAH</th><th>FOTO ALAT</th><th>LOKASI</th><th>KET</th>
            </tr>
          </thead>
          <tbody id="perangkatTableBody">
            <tr><td colspan="11" class="py-4 text-muted">Memuat data dari Google Sheets...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  
 <!-- BOTTOM NAVIGATION BAR SERAGAM (4 MENU) -->
  <div class="bottom-app-nav">
    <a href="search.html" class="nav-link-mobile">
      <div class="nav-icon">🔍</div><span>Sistem Cari</span>
    </a>
    <a href="admin.html" class="nav-link-mobile">
      <div class="nav-icon">💻</div><span>Info Perangkat</span>
    </a>
    <a href="index.html" class="nav-link-mobile">
      <div class="nav-icon">📝</div><span>Lapangan</span>
    </a>
    <a href="laporan.html" class="nav-link-mobile">
      <div class="nav-icon">📊</div><span>Laporan</span>
    </a>
  </div>

  <!-- MODAL PREVIEW FOTO & PANEL -->
  <div id="imageModal" class="modal fade" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content bg-dark text-white rounded-4 text-center">
        <div class="modal-header border-secondary">
          <h6 class="modal-title text-info" id="imageModalTitle">Preview Foto</h6>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body p-2"><img id="modalImgPreview" src="" class="img-fluid rounded-3" style="max-height: 80vh;"></div>
      </div>
    </div>
  </div>

  <div id="panelModal" class="modal fade" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content bg-dark text-white rounded-4">
        <div class="modal-header border-secondary">
          <h6 class="modal-title text-info" id="panelModalTitle">Panel Kontrol</h6>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="panelModalBody"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyHOXnA4YsBeNdPDUxXwPlsJHPJo7k7E4IqItpNOKLjfsYeQce7a9Gda8p-3p-Ys6tJkg/exec";
    let listPerangkat = [];

    window.onload = function() { checkAuth(); loadPerangkatData(); };
    function checkAuth() { if (!localStorage.getItem("user_session")) window.location.href = "login.html"; }

    function loadPerangkatData() {
      fetch(`${SCRIPT_URL}?action=getInfoPerangkat`).then(r => r.json()).then(res => {
        if (res.status === "success") { listPerangkat = res.data; renderPerangkat(listPerangkat); }
      });
    }

    function filterPerangkat() {
      const q = document.getElementById('searchPerangkat').value.toLowerCase();
      const filtered = listPerangkat.filter(item => 
        item.nama_lama?.toLowerCase().includes(q) || item.cid_lama?.toLowerCase().includes(q) || item.sn?.toLowerCase().includes(q) || item.odp?.toLowerCase().includes(q)
      );
      renderPerangkat(filtered);
    }

    function showImageModal(url, title) {
      if(!url || url === "-") { alert("Foto tidak tersedia."); return; }
      document.getElementById('imageModalTitle').innerText = title;
      document.getElementById('modalImgPreview').src = url;
      new bootstrap.Modal(document.getElementById('imageModal')).show();
    }

    function bukaModalLaporan() {
      document.getElementById('panelModalTitle').innerText = "📊 Sistem Hapus Massal & Arsip";
      document.getElementById('panelModalBody').innerHTML = `
        <textarea id="listCidHapus" class="form-control form-control-sm bg-dark text-white mb-2" rows="4" placeholder="Tempel laporan WhatsApp untuk hapus selektif..."></textarea>
        <button onclick="alert('Parameter hapus terhubung dengan backend.')" class="btn btn-danger btn-sm w-100 fw-bold">Eksekusi Hapus & Arsip</button>
      `;
      new bootstrap.Modal(document.getElementById('panelModal')).show();
    }

    function bukaModalInput() {
      document.getElementById('panelModalTitle').innerText = "📥 Sistem Input Massal";
      document.getElementById('panelModalBody').innerHTML = `
        <textarea id="teksMassal" class="form-control form-control-sm bg-dark text-white mb-2 font-monospace" rows="5" placeholder="Nama : ...\nCID : ..."></textarea>
        <button onclick="alert('Parameter input massal siap diproses.')" class="btn btn-primary btn-sm w-100 fw-bold">Proses Input Massal</button>
      `;
      new bootstrap.Modal(document.getElementById('panelModal')).show();
    }

    function renderPerangkat(data) {
      document.getElementById('badgeTotal').innerText = `${data.length} Data`;
      const tbody = document.getElementById('perangkatTableBody');
      if (data.length === 0) { tbody.innerHTML = '<tr><td colspan="11" class="py-4 text-muted">Data tidak ditemukan.</td></tr>'; return; }
      tbody.innerHTML = data.map(item => `
        <tr>
          <td>${item.timestamp || '-'}</td><td>${item.pop || '-'}</td>
          <td class="fw-bold text-primary">${item.odp || '-'}</td><td>${item.cid_lama || '-'}</td>
          <td class="fw-bold">${item.nama_lama || '-'}</td><td class="text-success fw-bold">${item.sn || '-'}</td>
          <td>${item.psn || '-'}</td>
          <td>${item.foto_rumah_url ? `<button onclick="showImageModal('${item.foto_rumah_url}', 'Foto Rumah')" class="btn btn-primary btn-sm py-0 px-2">Lihat</button>` : '-'}</td>
          <td>${item.foto_alat_url ? `<button onclick="showImageModal('${item.foto_alat_url}', 'Foto Alat')" class="btn btn-info text-white btn-sm py-0 px-2">Lihat</button>` : '-'}</td>
          <td>${item.sherlock ? `<a href="https://www.google.com/maps?q=${item.sherlock}" target="_blank">📍 Maps</a>` : '-'}</td>
          <td>${item.keterangan || '-'}</td>
        </tr>
      `).join('');
    }

    function logout() { localStorage.removeItem("user_session"); window.location.href = "login.html"; }
  </script>
</body>
</html>
