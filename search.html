<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Rekap Data Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .table-container { overflow-x: auto; max-height: 70vh; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        th, td { border: 1px solid #334155; padding: 10px 12px; text-align: left; }
        th { background-color: #1e293b; color: #94a3b8; position: sticky; top: 0; z-index: 10; font-weight: 600; text-transform: uppercase;}
        tr:hover { background-color: #1e293b; }
        .badge { padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 0.75rem; }
        .bg-menunggu { background-color: #b45309; }
        .bg-sudah { background-color: #15803d; }
        .bg-kunjungan { background-color: #0369a1; }
    </style>
</head>
<body class="p-4">

    <!-- Header -->
    <div class="flex justify-between items-center mb-4 bg-slate-800 p-4 rounded-lg border border-slate-700">
        <h2 class="text-xl font-bold"><i class="fas fa-chart-bar mr-2 text-blue-400"></i> Panel Rekap Data Admin</h2>
        <button class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded text-sm font-bold"><i class="fas fa-sign-out-alt"></i> Keluar</button>
    </div>

    <!-- Filter & Action Controls -->
    <div class="bg-slate-800 p-4 rounded-lg border border-slate-700 mb-4">
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-4">
            
            <!-- 1. Dropdown Sumber Sheet (DITAMBAH SUDAH KUNJUNGAN) -->
            <div>
                <label class="block text-xs font-bold text-slate-400 mb-1">PILIH SUMBER SHEET</label>
                <select id="filterSheet" onchange="applyFilter()" class="w-full bg-slate-900 border border-slate-600 rounded p-2 text-sm focus:outline-none focus:border-blue-500">
                    <option value="Semua Sheet">Semua Sheet</option>
                    <option value="MENUNGGU DIAMBIL">MENUNGGU DIAMBIL</option>
                    <option value="SUDAH DIAMBIL">SUDAH DIAMBIL</option>
                    <option value="SUDAH KUNJUNGAN">SUDAH KUNJUNGAN</option>
                </select>
            </div>

            <!-- 2. Kriteria Cari -->
            <div>
                <label class="block text-xs font-bold text-slate-400 mb-1">KRITERIA CARI</label>
                <select id="filterKriteria" onchange="applyFilter()" class="w-full bg-slate-900 border border-slate-600 rounded p-2 text-sm focus:outline-none focus:border-blue-500">
                    <option value="Semua Kriteria">Semua Kriteria</option>
                    <option value="CID">CID</option>
                    <option value="NAMA">Nama</option>
                    <option value="SN">SN</option>
                </select>
            </div>

            <!-- 3. Tanggal -->
            <div>
                <label class="block text-xs font-bold text-slate-400 mb-1">TANGGAL</label>
                <input type="date" id="filterTanggal" onchange="applyFilter()" class="w-full bg-slate-900 border border-slate-600 rounded p-2 text-sm focus:outline-none focus:border-blue-500 text-white [color-scheme:dark]">
            </div>

            <!-- 4. Kata Kunci -->
            <div>
                <label class="block text-xs font-bold text-slate-400 mb-1">KATA KUNCI / SCAN</label>
                <div class="flex">
                    <input type="text" id="filterKeyword" onkeyup="applyFilter()" placeholder="Ketik CID, Nama, SN..." class="w-full bg-slate-900 border border-slate-600 rounded-l p-2 text-sm focus:outline-none focus:border-blue-500">
                    <button class="bg-cyan-500 hover:bg-cyan-600 text-slate-900 font-bold px-3 rounded-r text-sm"><i class="fas fa-camera"></i> SCAN</button>
                </div>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="flex justify-end gap-2">
            <button onclick="kirimWAGabungan()" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded text-sm font-bold"><i class="fab fa-whatsapp mr-1"></i> Kirim Gabungan (WA)</button>
            <button onclick="loadData()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded text-sm font-bold"><i class="fas fa-sync-alt mr-1"></i> Refresh</button>
        </div>
    </div>

    <!-- Table Data -->
    <div class="bg-slate-800 rounded-lg border border-slate-700 table-container">
        <table>
            <thead>
                <tr>
                    <th class="w-10 text-center"><input type="checkbox" id="checkAll" onchange="toggleAllCheckboxes(this)"></th>
                    <th>SHEET</th>
                    <th>WAKTU</th>
                    <th>ODP / POP</th>
                    <th>CID / NAMA</th>
                    <th>SN / P-SN</th>
                    <th>PAKET / NO HP</th>
                    <th>SHERLOCK</th>
                    <th>SALES / TS</th>
                    <th>KETERANGAN</th>
                    <th>AKSI</th>
                </tr>
            </thead>
            <tbody id="tBody">
                <!-- Data akan dimuat disini menggunakan JavaScript -->
                <tr><td colspan="11" class="text-center py-6 text-yellow-500 font-bold"><i class="fas fa-hourglass-half fa-spin mr-2"></i> Sedang mengambil data dari server... Mohon tunggu.</td></tr>
            </tbody>
        </table>
    </div>

    <!-- Script Logika Inti -->
    <script>
        // ==========================================
        // ⚠️ GANTI DENGAN URL WEB APP APPS SCRIPT ANDA
        // ==========================================
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzsS4-LPktyuUKoC6Cf6TERV498wqvm31frvD7-W0gFhrCb9fkgwVBjAHeLrEeVMd25/exec"; 
        
        let globalDataList = [];
        let filteredDataList = [];

        // Memuat Data Pertama Kali
        window.onload = () => { loadData(); };

        // FUNGSI TARIK DATA DARI APPS SCRIPT
        async function loadData() {
            document.getElementById("tBody").innerHTML = `<tr><td colspan="11" class="text-center py-6 text-yellow-500 font-bold"><i class="fas fa-spinner fa-spin mr-2"></i> Memuat Ulang Data...</td></tr>`;
            try {
                let res = await fetch(SCRIPT_URL + "?action=getDataAdmin");
                let result = await res.json();
                
                if(result.status === "success") {
                    globalDataList = result.data;
                    applyFilter(); // Tampilkan data setelah berhasil dimuat
                } else {
                    document.getElementById("tBody").innerHTML = `<tr><td colspan="11" class="text-center py-4 text-red-500">Error: ${result.message}</td></tr>`;
                }
            } catch(e) {
                document.getElementById("tBody").innerHTML = `<tr><td colspan="11" class="text-center py-4 text-red-500">Gagal terhubung ke Database. Periksa koneksi atau URL Apps Script.</td></tr>`;
            }
        }

        // FUNGSI FILTER DATA
        function applyFilter() {
            let filterSheet = document.getElementById("filterSheet").value;
            let filterKriteria = document.getElementById("filterKriteria").value;
            let filterTanggal = document.getElementById("filterTanggal").value; // Format: yyyy-mm-dd
            let filterKeyword = document.getElementById("filterKeyword").value.toLowerCase();

            filteredDataList = globalDataList.filter(row => {
                // 1. Filter Sheet
                let matchSheet = true;
                if(filterSheet !== "Semua Sheet") {
                    if(filterSheet === "MENUNGGU DIAMBIL") {
                        matchSheet = (row.sumber_sheet === "MENUNGGU DIAMBIL" || row.sumber_sheet === "BARIS 1" || row.sumber_sheet === "BARIS 2");
                    } else {
                        matchSheet = (row.sumber_sheet === filterSheet);
                    }
                }

                // 2. Filter Tanggal
                let matchTanggal = true;
                if(filterTanggal) {
                    // Konversi string DB ke standar (Contoh parsing sederhana, sesuaikan dengan output DB Anda)
                    let rowTime = String(row.timestamp || "").toLowerCase();
                    // Untuk pencarian aman, cocokkan apakah string input ada di dalam string tanggal DB
                    let [y, m, d] = filterTanggal.split("-");
                    let formatBalik = `${d}/${m}/${y}`; // Sesuai format Indonesia (DD/MM/YYYY)
                    if(rowTime.indexOf(formatBalik) === -1 && rowTime.indexOf(filterTanggal) === -1) {
                        matchTanggal = false;
                    }
                }

                // 3. Filter Kata Kunci & Kriteria
                let matchKeyword = true;
                if(filterKeyword) {
                    if(filterKriteria === "CID") {
                        matchKeyword = String(row.cid_lama).toLowerCase().includes(filterKeyword);
                    } else if(filterKriteria === "NAMA") {
                        matchKeyword = String(row.nama_lama).toLowerCase().includes(filterKeyword);
                    } else if(filterKriteria === "SN") {
                        matchKeyword = String(row.sn).toLowerCase().includes(filterKeyword);
                    } else {
                        // Semua Kriteria
                        let gabunganText = `${row.cid_lama} ${row.nama_lama} ${row.sn} ${row.odp} ${row.pop}`.toLowerCase();
                        matchKeyword = gabunganText.includes(filterKeyword);
                    }
                }

                return matchSheet && matchTanggal && matchKeyword;
            });

            renderTable(filteredDataList);
        }

        // FUNGSI TAMPILKAN KE TABEL
        function renderTable(dataArray) {
            const tbody = document.getElementById("tBody");
            tbody.innerHTML = "";

            if(dataArray.length === 0) {
                tbody.innerHTML = `<tr><td colspan="11" class="text-center py-6 text-slate-400">Tidak ada data yang cocok dengan pencarian.</td></tr>`;
                return;
            }

            dataArray.forEach((row, index) => {
                // Warna Badge berdasarkan sumber sheet
                let badgeClass = "bg-menunggu";
                if(row.sumber_sheet === "SUDAH DIAMBIL") badgeClass = "bg-sudah";
                if(row.sumber_sheet === "SUDAH KUNJUNGAN") badgeClass = "bg-kunjungan";

                let mapsLink = row.sherlock && row.sherlock !== "-" ? `<a href="${row.sherlock.includes('http') ? row.sherlock : 'https://www.google.com/maps?q='+row.sherlock}" target="_blank" class="text-blue-400 hover:underline cursor-pointer"><i class="fas fa-map-marker-alt"></i> Buka Maps</a>` : "-";

                let tr = document.createElement("tr");
                tr.innerHTML = `
                    <td class="text-center"><input type="checkbox" class="row-check" value="${index}"></td>
                    <td><span class="badge ${badgeClass}">${row.sumber_sheet}</span></td>
                    <td class="whitespace-nowrap">${row.timestamp || "-"}</td>
                    <td><b class="text-cyan-400">${row.odp || "-"}</b><br><span class="text-slate-400 text-xs">${row.pop || "-"}</span></td>
                    <td><b class="text-white">${row.cid_lama || "-"}</b><br><span class="text-slate-300 text-xs">${row.nama_lama || "-"}</span></td>
                    <td><b class="text-green-400">${row.sn || "-"}</b><br><span class="text-slate-400 text-xs">${row.psn || "-"}</span></td>
                    <td><b class="text-white">${row.paket || "-"}</b><br><span class="text-slate-400 text-xs"><i class="fas fa-phone-alt mr-1"></i>${row.nohp || "-"}</span></td>
                    <td>${mapsLink}</td>
                    <td><b class="text-white">${row.sales || "-"}</b><br><span class="text-yellow-500 text-xs"><i class="fas fa-wrench mr-1"></i>${row.ts || "-"}</span></td>
                    <td>${row.keterangan || "-"}</td>
                    <td class="text-center">
                        <button onclick="kirimWASatu(${index})" class="bg-green-600 hover:bg-green-500 text-white rounded p-2 shadow" title="Kirim WA">
                            <i class="fab fa-whatsapp"></i>
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Checkbox Master
        function toggleAllCheckboxes(masterObj) {
            let checkboxes = document.querySelectorAll('.row-check');
            checkboxes.forEach(cb => cb.checked = masterObj.checked);
        }

        // ============================================
        // KIRIM WHATSAPP (1 DATA) DENGAN NO HP
        // ============================================
        function kirimWASatu(index) {
            let row = filteredDataList[index];
            let namaTS = row.ts || row.sales || "-"; 
            
            let teksWA = 
`Nama : ${row.nama_lama || "-"}
CID  : ${row.cid_lama || "-"}
No HP: ${row.nohp || "-"}
ODP  : ${row.odp || "-"}
POP  : ${row.pop || "-"}
SN   : ${row.sn || "-"}
P-SN : ${row.psn || "-"}
KET  : ${row.keterangan || "-"}
TS   : ${namaTS}`;

            window.open(`https://wa.me/?text=${encodeURIComponent(teksWA)}`, '_blank');
        }

        // ============================================
        // KIRIM WHATSAPP GABUNGAN DENGAN NO HP
        // ============================================
        function kirimWAGabungan() {
            let checkboxes = document.querySelectorAll('.row-check:checked');
            if (checkboxes.length === 0) return alert("Silakan centang data yang ingin dikirim via WhatsApp terlebih dahulu!");

            let teksWA = "";
            checkboxes.forEach((cb) => {
                let row = filteredDataList[cb.value];
                let namaTS = row.ts || row.sales || "-";
                
                teksWA += 
`Nama : ${row.nama_lama || "-"}
CID  : ${row.cid_lama || "-"}
No HP: ${row.nohp || "-"}
ODP  : ${row.odp || "-"}
POP  : ${row.pop || "-"}
SN   : ${row.sn || "-"}
P-SN : ${row.psn || "-"}
KET  : ${row.keterangan || "-"}
TS   : ${namaTS}\n\n`;
            });
            
            window.open(`https://wa.me/?text=${encodeURIComponent(teksWA.trim())}`, '_blank');
        }
    </script>
</body>
</html>
