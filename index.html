<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard & Form Input Lapangan</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #0d1117; color: #c9d1d9; font-family: 'Segoe UI', sans-serif; }
    .card-custom { background-color: #161b22; border: 1px solid #30363d; border-radius: 8px; }
    .form-control, .form-select { background-color: #0d1117; color: #fff; border: 1px solid #30363d; }
    .form-control:focus { background-color: #0d1117; color: #fff; border-color: #58a6ff; }
  </style>
</head>
<body class="p-3 p-md-4">

  <div class="container" style="max-width: 800px;">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h4 class="text-info m-0">Input Lapangan (Baris 1)</h4>
      <a href="search.html" class="btn btn-outline-light btn-sm">Lihat Rekap Data 🔍</a>
    </div>

    <!-- METRIK RINGKASAN DASHBOARD -->
    <div class="row g-2 mb-4" id="dashboardCounts">
      <div class="col-4">
        <div class="card-custom p-3 text-center">
          <small class="text-muted d-block">Menunggu</small>
          <strong id="cntBelum" class="fs-4 text-warning">0</strong>
        </div>
      </div>
      <div class="col-4">
        <div class="card-custom p-3 text-center">
          <small class="text-muted d-block">Sudah Diambil</small>
          <strong id="cntSudah" class="fs-4 text-success">0</strong>
        </div>
      </div>
      <div class="col-4">
        <div class="card-custom p-3 text-center">
          <small class="text-muted d-block">Info Perangkat</small>
          <strong id="cntInfo" class="fs-4 text-info">0</strong>
        </div>
      </div>
    </div>

    <!-- FORM INPUT DATA -->
    <div class="card-custom p-4">
      <form id="inputForm">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Koordinat Sherlock</label>
            <input type="text" id="koordinat" name="koordinat" class="form-control" placeholder="-3.31, 114.59">
          </div>
          <div class="col-md-6">
            <label class="form-label">ODP</label>
            <input type="text" id="odp" name="odp" class="form-control" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">POP</label>
            <input type="text" id="pop" name="pop" class="form-control">
          </div>
          <div class="col-md-6">
            <label class="form-label">CID Lama</label>
            <input type="text" id="cid_lama" name="cid_lama" class="form-control" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Nama Lama</label>
            <input type="text" id="nama_lama" name="nama_lama" class="form-control" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">SN Unit</label>
            <input type="text" id="sn" name="sn" class="form-control" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">P-SN</label>
            <input type="text" id="psn" name="psn" class="form-control">
          </div>
          <div class="col-md-6">
            <label class="form-label">Foto Rumah (URL / Direct)</label>
            <input type="text" id="foto_rumah_url" name="foto_rumah_url" class="form-control" placeholder="https://...">
          </div>
          <div class="col-md-6">
            <label class="form-label">Foto Alat (URL / Direct)</label>
            <input type="text" id="foto_alat_url" name="foto_alat_url" class="form-control" placeholder="https://...">
          </div>
          <div class="col-12">
            <label class="form-label">Keterangan</label>
            <textarea id="keterangan" name="keterangan" class="form-control" rows="2"></textarea>
          </div>
        </div>

        <button type="submit" id="btnSubmit" class="btn btn-primary w-100 mt-4 fw-bold">Simpan Data Ke Baris 1</button>
      </form>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyHOXnA4YsBeNdPDUxXwPlsJHPJo7k7E4IqItpNOKLjfsYeQce7a9Gda8p-3p-Ys6tJkg/exec";

    window.onload = function() {
      fetch(`${SCRIPT_URL}?action=getDashboard`)
        .then(r => r.json())
        .then(res => {
          document.getElementById('cntBelum').innerText = res.countBelum || 0;
          document.getElementById('cntSudah').innerText = res.countSudah || 0;
          document.getElementById('cntInfo').innerText = res.countInfoPerangkat || 0;
        });
    };

    document.getElementById('inputForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const btn = document.getElementById('btnSubmit');
      btn.disabled = true;
      btn.innerText = "Menyimpan Data...";

      const formData = new FormData(this);
      const data = {};
      formData.forEach((value, key) => data[key] = value);

      fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify(data)
      })
      .then(r => r.json())
      .then(res => {
        if(res.status === "success") {
          alert("Data berhasil disimpan ke sheet Baris 1!");
          this.reset();
        } else {
          alert("Gagal: " + res.message);
        }
      })
      .catch(err => alert("Terjadi kesalahan koneksi!"))
      .finally(() => {
        btn.disabled = false;
        btn.innerText = "Simpan Data Ke Baris 1";
      });
    });
  </script>
</body>
</html>
