<!-- DEPENDENCIES EXTERNAL -->
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/html5-qrcode"></script>

<style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    
    .app-wrapper {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: #F1F5F9;
        min-height: 100vh;
        width: 100vw;
        max-width: 100%;
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        overflow-x: hidden;
    }

    #field-map {
        height: 160px;
        width: 100%;
        border-radius: 12px;
        z-index: 10;
    }

    .toast-msg {
        position: fixed;
        bottom: -100px;
        left: 50%;
        transform: translateX(-50%);
        background: #0f172a;
        color: white;
        padding: 10px 20px;
        border-radius: 99px;
        transition: all 0.3s ease;
        z-index: 1000;
        font-size: 12px;
        font-weight: 600;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.2);
        white-space: nowrap;
    }

    input, select, textarea, button { font-size: 12px !important; }
</style>

<div class="app-wrapper flex flex-col min-h-screen">

    <header class="bg-white border-b px-4 py-2.5 flex justify-between items-center sticky top-0 z-40 shadow-sm w-full">
        <h1 class="text-xs sm:text-sm font-extrabold text-slate-800" id="headerTitle">Sistem Lapangan</h1>
        <div class="flex items-center gap-2">
            <button onclick="switchToPegawaiView()" id="btnNavLapangan" class="bg-indigo-600 text-white font-bold px-3 py-1.5 rounded-xl text-xs shadow-sm flex items-center gap-1.5">
                <i class="fas fa-edit"></i> <span class="hidden sm:inline">Sistem</span> Lapangan
            </button>
            <button onclick="switchToAdminView()" id="btnNavAdmin" class="bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold px-3 py-1.5 rounded-xl text-xs flex items-center gap-1.5 border border-gray-200">
                <i class="fas fa-chart-line"></i> Dashboard <span class="hidden sm:inline">Admin</span>
            </button>
            <div id="adminBadge" class="hidden flex items-center gap-1.5 border-l pl-2 ml-1">
                <span class="bg-indigo-100 text-indigo-700 text-[9px] font-extrabold px-2 py-0.5 rounded-full uppercase">Admin</span>
                <button onclick="logoutAdmin()" class="text-xs text-red-500 font-bold hover:underline" title="Keluar Admin">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- FORM INPUT -->
    <main id="viewPegawai" class="flex-1 p-3 sm:p-5 flex justify-center items-start w-full">
        <div class="w-full max-w-md bg-white rounded-2xl shadow-sm border border-gray-100 p-4 space-y-3.5">
            <div class="bg-[#0284c7] text-white p-3 rounded-xl text-center shadow-sm">
                <p class="text-[11px] font-bold leading-relaxed">Peta Lokasi & Direct Direct Storage Upload</p>
            </div>

            <div class="rounded-xl overflow-hidden border border-gray-200 bg-gray-100 relative">
                <div id="field-map"></div>
            </div>

            <form id="formLapangan" onsubmit="handleFormSubmit(event)" class="space-y-3">
                <div>
                    <label class="text-[10px] font-extrabold text-gray-500 uppercase block mb-1">KOORDINAT GPS</label>
                    <input type="text" id="inpKoordinat" readonly placeholder="Mengunci sinyal GPS..." class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 text-gray-700 outline-none">
                </div>

                <div>
                    <label class="text-[10px] font-extrabold text-gray-500 uppercase block mb-1">ODP *</label>
                    <input type="text" id="inpOdp" required placeholder="Pilih ODP atau ketik baru" class="w-full bg-white border border-gray-200 rounded-xl px-3 py-2 text-gray-800 outline-none">
                </div>

                <div>
                    <label class="text-[10px] font-extrabold text-gray-500 uppercase block mb-1">POP *</label>
                    <input type="text" id="inpPop" required placeholder="Masukkan data nama POP" class="w-full bg-white border border-gray-200 rounded-xl px-3 py-2 text-gray-800 outline-none">
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-[10px] font-extrabold text-gray-500 uppercase block mb-1">CID LAMA *</label>
                        <input type="text" id="inpCidLama" required placeholder="Ex: CID10" class="w-full bg-white border border-gray-200 rounded-xl px-3 py-2 text-gray-800 outline-none">
                    </div>
                    <div>
                        <label class="text-[10px] font-extrabold text-gray-500 uppercase block mb-1">NAMA LAMA *</label>
                        <input type="text" id="inpNamaLama" required placeholder="Ex: Budiman" class="w-full bg-white border border-gray-200 rounded-xl px-3 py-2 text-gray-800 outline-none">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2 pt-1">
                    <div>
                        <input type="file" id="fileFotoRumah" accept="image/*" capture="environment" class="hidden" onchange="updateFileLabel('fileFotoRumah', 'btnFotoRumahLabel')">
                        <button type="button" onclick="document.getElementById('fileFotoRumah').click()" class="w-full border-2 border-dashed border-gray-300 rounded-xl py-2 px-1 text-center hover:bg-gray-50 flex items-center justify-center gap-1">
                            <i class="fas fa-camera text-gray-500 text-xs"></i>
                            <span id="btnFotoRumahLabel" class="text-[9px] font-extrabold text-gray-600 uppercase truncate">FOTO RUMAH *</span>
                        </button>
                    </div>
                    <div>
                        <input type="file" id="fileFotoAlat" accept="image/*" capture="environment" class="hidden" onchange="updateFileLabel('fileFotoAlat', 'btnFotoAlatLabel')">
                        <button type="button" onclick="document.getElementById('fileFotoAlat').click()" class="w-full border-2 border-dashed border-gray-300 rounded-xl py-2 px-1 text-center hover:bg-gray-50 flex items-center justify-center gap-1">
                            <i class="fas fa-camera text-gray-500 text-xs"></i>
                            <span id="btnFotoAlatLabel" class="text-[9px] font-extrabold text-gray-600 uppercase truncate">FOTO ALAT *</span>
                        </button>
                    </div>
                </div>

                <div>
                    <label class="text-[10px] font-extrabold text-gray-500 uppercase block mb-1">SERIAL NUMBER (SN) UNIT *</label>
                    <div class="flex gap-2">
                        <input type="text" id="inpSnUnit" required placeholder="Ketuk Scan SN ->" class="flex-1 bg-white border border-gray-200 rounded-xl px-3 py-2 text-gray-800 outline-none">
                        <button type="button" onclick="triggerScanSN()" class="bg-amber-500 hover:bg-amber-600 text-white font-extrabold text-[10px] px-3.5 py-2 rounded-xl shadow-sm whitespace-nowrap">Scan SN</button>
                    </div>
                </div>

                <div>
                    <label class="text-[10px] font-extrabold text-gray-500 uppercase block mb-1">KETERANGAN (OPSIONAL)</label>
                    <textarea id="inpKeterangan" rows="2" placeholder="Catatan tambahan..." class="w-full bg-white border border-gray-200 rounded-xl p-2.5 text-gray-800 outline-none"></textarea>
                </div>

                <button type="submit" id="btnSubmit" class="w-full bg-[#0f2942] hover:bg-[#091b2c] text-white font-bold py-3 rounded-xl shadow-md text-xs tracking-wide mt-2">
                    Kirim Data Lapangan
                </button>
            </form>
        </div>
    </main>

    <!-- DASHBOARD ADMIN REALTIME -->
    <main id="viewAdmin" class="hidden flex-1 p-3 sm:p-6 max-w-6xl mx-auto w-full space-y-4">
        <div class="flex justify-between items-center">
            <h2 class="text-base font-extrabold text-gray-800">Panel Rekap Data Admin (Realtime)</h2>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
            <div class="p-3 bg-gray-50 border-b space-y-2">
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
                    <div>
                        <label class="text-[9px] font-bold text-gray-500 uppercase">Pilih Sumber Sheet</label>
                        <select id="filterSheet" onchange="filterAdminData()" class="w-full bg-white border border-gray-200 rounded-xl px-2.5 py-1.5 text-xs font-semibold outline-none">
                            <option value="ALL">-- Semua Sheet --</option>
                            <option value="Laporan">Laporan</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-[9px] font-bold text-gray-500 uppercase">Kata Kunci</label>
                        <input type="text" id="adminSearchInput" onkeyup="filterAdminData()" placeholder="Cari ODP, CID, SN..." class="w-full bg-white border border-gray-200 rounded-xl px-3 py-1.5 text-xs outline-none">
                    </div>
                </div>

                <div class="flex flex-col sm:flex-row justify-between items-center pt-1 gap-2 border-t border-gray-200">
                    <span id="searchResultCount" class="text-[10px] font-bold text-gray-500">Memuat data...</span>
                    <div class="flex items-center gap-2">
                        <button onclick="sendGroupToWA()" class="bg-teal-700 text-white font-bold text-xs px-3 py-1.5 rounded-xl shadow-sm flex items-center gap-1">
                            <i class="fas fa-layer-group"></i> Kirim Gabungan (<span id="selectedCount">0</span>)
                        </button>
                        <button onclick="loadAdminData()" class="text-indigo-600 text-xs font-bold bg-white px-3 py-1.5 rounded-xl border border-gray-200 hover:bg-gray-100">
                            <i class="fas fa-sync-alt"></i> Refresh
                        </button>
                    </div>
                </div>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs">
                    <thead class="bg-slate-900 text-white uppercase text-[9px]">
                        <tr>
                            <th class="py-2.5 px-3 text-center"><input type="checkbox" id="selectAllCheckbox" onchange="toggleSelectAll(this)"></th>
                            <th class="py-2.5 px-3">Sumber Sheet</th>
                            <th class="py-2.5 px-3">Waktu</th>
                            <th class="py-2.5 px-3">ODP</th>
                            <th class="py-2.5 px-3">POP</th>
                            <th class="py-2.5 px-3">CID / Nama</th>
                            <th class="py-2.5 px-3">SN Unit</th>
                            <th class="py-2.5 px-3 text-center">Gambar (Real-Time)</th>
                            <th class="py-2.5 px-3 text-center">Aksi WA</th>
                        </tr>
                    </thead>
                    <tbody id="tableBodyAdmin">
                        <tr><td colspan="9" class="py-4 text-center text-gray-400">Memuat data...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- MODAL SCANNER BARCODE -->
    <div id="modalScanner" class="fixed inset-0 z-[600] bg-black/80 hidden flex-col items-center justify-center p-4">
        <div class="bg-white w-full max-w-xs rounded-2xl p-4 space-y-3 relative">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 class="text-xs font-bold text-gray-800"><i class="fas fa-qrcode mr-1"></i> Scan Barcode SN</h3>
                <button onclick="closeScanner()" class="text-gray-400 font-bold">&times;</button>
            </div>
            <div id="reader" class="w-full overflow-hidden rounded-xl bg-black min-h-[200px]"></div>
        </div>
    </div>

    <!-- MODAL LOGIN ADMIN -->
    <div id="modalLoginAdmin" class="fixed inset-0 z-50 bg-black/50 hidden items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-xs w-full p-5 space-y-4 shadow-xl">
            <div class="text-center">
                <h3 class="text-base font-bold text-gray-900">Login Admin</h3>
            </div>
            <input type="password" id="adminPassword" placeholder="Kata Sandi Admin" class="w-full px-3 py-2 bg-gray-50 border rounded-xl text-xs font-bold outline-none">
            <div class="flex gap-2">
                <button onclick="closeLoginAdminModal()" class="flex-1 py-2 text-xs font-bold text-gray-500">Batal</button>
                <button onclick="submitAdminLogin()" class="flex-1 bg-indigo-600 text-white py-2 rounded-xl text-xs font-bold">Masuk</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast-msg">Notifikasi</div>
</div>

<script>
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwESnxnJqIkgKIkEOc2UMr4uG9esO7l2wiGQ8q6uGNMLGYE6HAATTyRaXenGs5ok0HJSw/exec";
    
    // CONFIG IMAGEKIT PUBLIC DIRECT UPLOAD
    const IMAGEKIT_PUBLIC_KEY = "public_xxxxxxxxxxxxxxxx"; 
    const IMAGEKIT_URL_ENDPOINT = "https://ik.imagekit.io/your_imagekit_id/"; 

    let map, userMarker, html5QrCode;
    let currentCoords = { lat: 0, lng: 0 };
    let isAdminLoggedIn = false;
    let globalAdminData = [], filteredAdminData = [];

    function translateSheetName(rawName) {
        if (!rawName) return "-";
        if (rawName.toLowerCase() === "baris 1") return "info perangkat";
        return rawName;
    }

    window.addEventListener('load', () => {
        initGPSMap();
        checkAdminSession();
    });

    function initGPSMap() {
        const mapContainer = document.getElementById('field-map');
        map = L.map(mapContainer, { zoomControl: false }).setView([-6.200000, 106.816666], 15);
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(pos => {
                currentCoords = { lat: pos.coords.latitude, lng: pos.coords.longitude };
                document.getElementById('inpKoordinat').value = `${currentCoords.lat.toFixed(6)}, ${currentCoords.lng.toFixed(6)}`;

                if (!userMarker) {
                    const icon = L.divIcon({
                        className: '',
                        html: '<div style="width:12px;height:12px;background:#3b82f6;border:2px solid white;border-radius:50%"></div>',
                        iconSize: [12, 12], iconAnchor: [6, 6]
                    });
                    userMarker = L.marker([currentCoords.lat, currentCoords.lng], { icon: icon }).addTo(map);
                } else {
                    userMarker.setLatLng([currentCoords.lat, currentCoords.lng]);
                }
                map.setView([currentCoords.lat, currentCoords.lng], 16);
            });
        }
    }

    function triggerScanSN() {
        document.getElementById('modalScanner').classList.replace('hidden', 'flex');
        if (!html5QrCode) html5QrCode = new Html5Qrcode("reader");
        html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: 200 }, (decodedText) => {
            document.getElementById('inpSnUnit').value = decodedText;
            showToast("SN Terbaca: " + decodedText);
            closeScanner();
        }).catch(() => closeScanner());
    }

    function closeScanner() {
        if (html5QrCode && html5QrCode.isScanning) html5QrCode.stop();
        document.getElementById('modalScanner').classList.replace('flex', 'hidden');
    }

    function updateFileLabel(inputId, labelId) {
        const input = document.getElementById(inputId);
        if (input.files && input.files[0]) {
            document.getElementById(labelId).innerText = "✓ " + input.files[0].name.substring(0, 8) + "...";
        }
    }

    // FUNGSI UTAMA: DIRECT UPLOAD DARI WEB BROWSER KE IMAGEKIT STORAGE
    async function directUploadToImageKit(fileInput, customFileName) {
        const formData = new FormData();
        formData.append("file", fileInput);
        formData.append("fileName", customFileName);
        formData.append("publicKey", IMAGEKIT_PUBLIC_KEY);

        const response = await fetch("https://upload.imagekit.io/api/v1/files/upload", {
            method: "POST",
            body: formData
        });

        if (!response.ok) throw new Error("Gagal upload gambar langsung ke ImageKit");
        const json = await response.json();
        return json.url; // Mengembalikan URL hasil upload direct
    }

    async function handleFormSubmit(e) {
        e.preventDefault();
        const btn = document.getElementById('btnSubmit');
        const fileRumah = document.getElementById('fileFotoRumah').files[0];
        const fileAlat = document.getElementById('fileFotoAlat').files[0];

        if (!fileRumah || !fileAlat) return showToast("Foto Rumah & Foto Perangkat Wajib!");

        try {
            btn.innerText = "Mengunggah Gambar Langsung ke ImageKit...";
            btn.disabled = true;

            const snUnit = document.getElementById('inpSnUnit').value || 'unit';
            
            // 1. Upload langsung dari browser pengguna ke ImageKit Server Storage
            const urlRumah = await directUploadToImageKit(fileRumah, `Rumah_${snUnit}_${Date.now()}.jpg`);
            const urlAlat = await directUploadToImageKit(fileAlat, `Alat_${snUnit}_${Date.now()}.jpg`);

            btn.innerText = "Menyimpan Link ke Google Sheet...";

            // 2. Kirim HANYA DATA LINK STRING ke Google Sheet
            const payload = {
                action: "simpanData",
                koordinat: document.getElementById('inpKoordinat').value,
                odp: document.getElementById('inpOdp').value,
                pop: document.getElementById('inpPop').value,
                cidLama: document.getElementById('inpCidLama').value,
                namaLama: document.getElementById('inpNamaLama').value,
                snUnit: snUnit,
                keterangan: document.getElementById('inpKeterangan').value,
                urlFotoRumah: urlRumah, // Hanya Link
                urlFotoAlat: urlAlat   // Hanya Link
            };

            const res = await fetch(GAS_WEB_APP_URL, {
                method: 'POST',
                body: JSON.stringify(payload)
            }).then(r => r.json());

            btn.innerText = "Kirim Data Lapangan";
            btn.disabled = false;
            showToast(res.message);

            if (res.success) {
                document.getElementById('formLapangan').reset();
                document.getElementById('btnFotoRumahLabel').innerText = "FOTO RUMAH *";
                document.getElementById('btnFotoAlatLabel').innerText = "FOTO ALAT *";
            }
        } catch (err) {
            btn.innerText = "Kirim Data Lapangan";
            btn.disabled = false;
            showToast("Gagal: " + err.message);
        }
    }

    function openLoginAdminModal() { document.getElementById('modalLoginAdmin').classList.replace('hidden', 'flex'); }
    function closeLoginAdminModal() { document.getElementById('modalLoginAdmin').classList.replace('flex', 'hidden'); }

    function submitAdminLogin() {
        const pass = document.getElementById('adminPassword').value;
        fetch(GAS_WEB_APP_URL, {
            method: 'POST',
            body: JSON.stringify({ action: "loginAdmin", password: pass })
        }).then(res => res.json()).then(res => {
            if(res.success) {
                sessionStorage.setItem('admin_session', 'true');
                checkAdminSession();
                closeLoginAdminModal();
                switchToAdminView();
            } else showToast("Password Salah!");
        });
    }

    function checkAdminSession() {
        isAdminLoggedIn = sessionStorage.getItem('admin_session') === 'true';
        if(isAdminLoggedIn) document.getElementById('adminBadge').classList.remove('hidden');
        else document.getElementById('adminBadge').classList.add('hidden');
    }

    function logoutAdmin() {
        sessionStorage.removeItem('admin_session');
        checkAdminSession();
        switchToPegawaiView();
    }

    function switchToAdminView() {
        if(!isAdminLoggedIn) return openLoginAdminModal();
        document.getElementById('viewPegawai').classList.add('hidden');
        document.getElementById('viewAdmin').classList.remove('hidden');
        loadAdminData();
    }

    function switchToPegawaiView() {
        document.getElementById('viewAdmin').classList.add('hidden');
        document.getElementById('viewPegawai').classList.remove('hidden');
        setTimeout(() => map.invalidateSize(), 300);
    }

    function loadAdminData() {
        document.getElementById('searchResultCount').innerText = "Memuat data...";
        fetch(GAS_WEB_APP_URL, {
            method: 'POST',
            body: JSON.stringify({ action: "getRekap" })
        }).then(res => res.json()).then(res => {
            globalAdminData = res.data || [];
            filterAdminData();
        });
    }

    function filterAdminData() {
        const query = document.getElementById('adminSearchInput').value.toLowerCase().trim();
        filteredAdminData = globalAdminData.filter(item => {
            if (!query) return true;
            return (item.cidLama || "").toLowerCase().includes(query) || 
                   (item.namaLama || "").toLowerCase().includes(query) || 
                   (item.odp || "").toLowerCase().includes(query) || 
                   (item.snUnit || "").toLowerCase().includes(query);
        });
        renderAdminTable(filteredAdminData);
    }

    function downloadImage(url, filename) {
        if (!url) return;
        const downloadUrl = url.includes('?') ? `${url}&ik-attachment=true` : `${url}?ik-attachment=true`;
        fetch(downloadUrl)
            .then(res => res.blob())
            .then(blob => {
                const a = document.createElement('a');
                a.href = window.URL.createObjectURL(blob);
                a.download = filename || 'image.jpg';
                a.click();
            }).catch(() => window.open(downloadUrl, '_blank'));
    }

    function renderAdminTable(data) {
        const tbody = document.getElementById('tableBodyAdmin');
        document.getElementById('searchResultCount').innerText = `Total Hasil: ${data.length} Data`;
        updateSelectedCount();

        if(!data || data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="9" class="py-4 text-center text-gray-400">Data tidak ditemukan.</td></tr>';
            return;
        }

        tbody.innerHTML = data.map((item, index) => {
            const btnRumah = item.urlFotoRumah ? 
                `<div class="inline-flex gap-1 my-0.5">
                    <a href="${item.urlFotoRumah}" target="_blank" class="bg-indigo-50 text-indigo-600 border font-bold px-1.5 py-0.5 rounded text-[10px]">
                        <i class="fas fa-eye"></i> Rumah
                    </a>
                    <button onclick="downloadImage('${item.urlFotoRumah}', 'Rumah_${item.snUnit || index}.jpg')" class="bg-slate-100 text-slate-700 border font-bold px-1.5 py-0.5 rounded text-[10px]">
                        <i class="fas fa-download"></i>
                    </button>
                </div>` : '-';

            const btnAlat = item.urlFotoAlat ? 
                `<div class="inline-flex gap-1 my-0.5">
                    <a href="${item.urlFotoAlat}" target="_blank" class="bg-indigo-50 text-indigo-600 border font-bold px-1.5 py-0.5 rounded text-[10px]">
                        <i class="fas fa-eye"></i> Alat
                    </a>
                    <button onclick="downloadImage('${item.urlFotoAlat}', 'Alat_${item.snUnit || index}.jpg')" class="bg-slate-100 text-slate-700 border font-bold px-1.5 py-0.5 rounded text-[10px]">
                        <i class="fas fa-download"></i>
                    </button>
                </div>` : '-';

            return `
                <tr class="border-b hover:bg-gray-50">
                    <td class="py-2 px-3 text-center"><input type="checkbox" class="row-checkbox cursor-pointer" value="${index}" onchange="updateSelectedCount()"></td>
                    <td class="py-2 px-3 font-semibold text-gray-500">${translateSheetName(item.sheetAsal)}</td>
                    <td class="py-2 px-3 whitespace-nowrap">${item.waktu || '-'}</td>
                    <td class="py-2 px-3 font-bold text-indigo-600">${item.odp || '-'}</td>
                    <td class="py-2 px-3">${item.pop || '-'}</td>
                    <td class="py-2 px-3">${item.cidLama || '-'} / ${item.namaLama || '-'}</td>
                    <td class="py-2 px-3 font-mono">${item.snUnit || '-'}</td>
                    <td class="py-2 px-3 text-center whitespace-nowrap">${btnRumah} <br/> ${btnAlat}</td>
                    <td class="py-2 px-3 text-center">
                        <button onclick="sendSingleWA(${index})" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold text-[10px] px-2.5 py-1 rounded-lg">
                            <i class="fab fa-whatsapp"></i> WA
                        </button>
                    </td>
                </tr>
            `;
        }).join('');
    }

    function toggleSelectAll(master) {
        document.querySelectorAll('.row-checkbox').forEach(cb => cb.checked = master.checked);
        updateSelectedCount();
    }

    function updateSelectedCount() {
        const selected = document.querySelectorAll('.row-checkbox:checked').length;
        document.getElementById('selectedCount').innerText = selected;
    }

    function sendSingleWA(index) {
        const item = filteredAdminData[index];
        if(!item) return;

        let text = `*📌 LAPORAN DATA LAPANGAN*\n`;
        text += `------------------------------------\n`;
        text += `*ODP:* ${item.odp || '-'}\n`;
        text += `*POP:* ${item.pop || '-'}\n`;
        text += `*CID:* ${item.cidLama || '-'}\n`;
        text += `*Nama:* ${item.namaLama || '-'}\n`;
        text += `*SN Unit:* ${item.snUnit || '-'}\n`;
        if(item.koordinat) text += `📍 *Sherlock:* https://maps.google.com/?q=${item.koordinat}\n`;
        if(item.urlFotoRumah) text += `🖼️ *Foto Rumah:* ${item.urlFotoRumah}\n`;
        if(item.urlFotoAlat) text += `🖼️ *Foto Alat:* ${item.urlFotoAlat}\n`;

        window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(text.trim())}`, '_blank');
    }

    function sendGroupToWA() {
        const selectedBoxes = document.querySelectorAll('.row-checkbox:checked');
        if(selectedBoxes.length === 0) return showToast("Pilih minimal 1 data!");

        let groupText = `*📋 REKAP GABUNGAN (${selectedBoxes.length} DATA LAPANGAN)*\n\n`;

        selectedBoxes.forEach((box, idx) => {
            const item = filteredAdminData[parseInt(box.value)];
            if(item) {
                groupText += `*${idx + 1}. ${item.namaLama || 'Tanpa Nama'}*\n`;
                groupText += `• ODP: ${item.odp || '-'}\n`;
                groupText += `• CID: ${item.cidLama || '-'}\n`;
                groupText += `• SN: ${item.snUnit || '-'}\n`;
                if(item.koordinat) groupText += `📍 Sherlock: https://maps.google.com/?q=${item.koordinat}\n`;
                if(item.urlFotoRumah) groupText += `🖼️ Foto Rumah: ${item.urlFotoRumah}\n`;
                if(item.urlFotoAlat) groupText += `🖼️ Foto Alat: ${item.urlFotoAlat}\n`;
                groupText += `------------------------------------\n`;
            }
        });

        window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(groupText.trim())}`, '_blank');
    }

    function showToast(msg) {
        const t = document.getElementById('toast');
        t.innerText = msg;
        t.style.bottom = '20px';
        setTimeout(() => t.style.bottom = '-100px', 3000);
    }
</script>k
