<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Rekap Data & Info Perangkat</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body { background-color: #0d1117; color: #c9d1d9; font-family: 'Segoe UI', sans-serif; }
    .card-custom { background-color: #161b22; border: 1px solid #30363d; border-radius: 8px; }
    .table-dark-custom { background-color: #161b22; color: #c9d1d9; border-color: #30363d; }
    .table-dark-custom th { background-color: #21262d; color: #58a6ff; }
    .nav-tabs .nav-link { color: #8b949e; border: none; }
    .nav-tabs .nav-link.active { color: #58a6ff; background-color: #161b22; border-bottom: 2px solid #58a6ff; }
    .img-preview { width: 45px; height: 45px; object-fit: cover; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body class="p-3 p-md-4">

  <div class="container-fluid">
    <!-- NAVIGASI TAB -->
    <ul class="nav nav-tabs mb-3" id="mainTab">
      <li class="nav-item">
        <button class="nav-link active fw-bold" onclick="switchTab('REKAP')">📋 Rekap Data Utama</button>
      </li>
      <li class="nav-item">
        <button class="nav-link fw-bold" onclick="switchTab('PERANGKAT')">📟 Info Perangkat (Baris 1)</button>
      </li>
    </ul>

    <!-- FILTER CONTROL -->
    <div class="card-custom p-3 mb-3">
      <div class="row g-2">
        <!-- FILTER SUMBER SHEET (KHUSUS TAB REKAP) -->
        <div class="col-md-3" id="boxFilterSumber">
          <label class="form-label text-light small fw-bold">PILIH SUMBER SHEET</label>
          <select id="filterSumber" class="form-select bg-dark text-white border-secondary" onchange="applyFilter()">
            <option value="SEMUA">Semua Status</option>
            <option value="MENUNGGU DIAMBIL">MENUNGGU DIAMBIL</option>
            <option value="SUDAH DIAMBIL">SUDAH DIAMBIL</option>
          </select>
        </div>

        <!-- KRITERIA CARI -->
        <div class="col-md-3">
          <label class="form-label text-light small fw-bold">KRITERIA CARI</label>
          <select id="filterKriteria" class="form-select bg-dark text-white border-secondary" onchange="applyFilter()">
            <option value="SEMUA">Semua Kriteria</option>
            <option value="ODP">ODP</option>
            <option value="POP">POP</option>
            <option value="NAMA">NAMA</option>
            <option value="CID">CID</option>
            <option value="PERANGKAT">PERANGKAT (SN & P-SN)</option>
          </select>
        </div>

        <!-- RENTANG TANGGAL DROPDOWN -->
        <div class="col-md-3">
          <label class="form-label text-light small fw-bold">RENTANG TANGGAL</label>
          <select id="filterTanggal" class="form-select bg-dark text-white border-secondary" onchange="applyFilter()">
            <option value="SEMUA">Semua Waktu</option>
            <option value="1_MINGGU">1 Minggu Terakhir</option>
            <option value="2_MINGGU">2 Minggu Terakhir</option>
            <option value="3_MINGGU">3 Minggu Terakhir</option>
            <option value="1_BULAN">1 Bulan Terakhir</option>
          </select>
        </div>

        <!-- KATA KUNCI & FITUR SCAN -->
        <div class="col-md-3">
          <label class="form-label text-light small fw-bold">KATA KUNCI / SCAN</label>
          <div class="input-group">
            <input type="text" id="filterSearch" class="form-control bg-dark text-white border-secondary" placeholder="Ketik CID, Nama, SN, ODP..." onkeyup="applyFilter()">
            <button class="btn btn-outline-info" type="button" onclick="startCameraScan()">📷 Scan</button>
          </div>
        </div>
      </div>

      <div class="d-flex justify-content-between align-items-center mt-3">
        <span class="text-white-50 fs-6">Total Hasil: <strong id="totalCount" class="text-info">0</strong> Data</span>
        <button class="btn btn-sm btn-secondary" onclick="resetFilter()">Reset Filter</button>
      </div>
    </div>

    <!-- AREA SCANNER CAMERA -->
    <div id="scannerModal" class="card-custom p-3 mb-3 d-none">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <h6 class="m-0 text-info">Arahkan Kamera ke Barcode / QR Code</h6>
        <button class="btn btn-sm btn-danger" onclick="stopCameraScan()">Tutup Kamera</button>
      </div>
      <div id="reader" style="width: 100%; max-width: 400px; margin: auto;"></div>
    </div>

    <!-- TABEL DATA -->
    <div class="card-custom p-2 table-responsive">
      <table class="table table-dark-custom table-hover align-middle small m-0" id="dataTable">
        <thead>
          <tr id="tableHeader"></tr>
        </thead>
        <tbody id="tableBody">
          <tr><td colspan="10" class="text-center py-4">Memuat data dari server...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // MASUKKAN URL WEB APP APPS SCRIPT ANDA DI SINI
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyHOXnA4YsBeNdPDUxXwPlsJHPJo7k7E4IqItpNOKLjfsYeQce7a9Gda8p-3p-Ys6tJkg/exec";

    let currentTab = "REKAP";
    let rawData = [];
    let html5QrCode = null;

    window.onload = function() {
      loadData();
    };

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.nav-link').forEach(el => el.classList.remove('active'));
      if (tab === 'REKAP') {
        document.querySelectorAll('.nav-link')[0].classList.add('active');
        document.getElementById('boxFilterSumber').style.display = 'block';
      } else {
        document.querySelectorAll('.nav-link')[1].classList.add('active');
        document.getElementById('boxFilterSumber').style.display = 'none';
      }
      loadData();
    }

    function loadData() {
      const action = (currentTab === "REKAP") ? "getDataAdmin" : "getInfoPerangkat";
      document.getElementById('tableBody').innerHTML = '<tr><td colspan="10" class="text-center py-4">Sedang mengambil data...</td></tr>';

      fetch(`${SCRIPT_URL}?action=${action}`)
        .then(res => res.json())
        .then(res => {
          if (res.status === "success") {
            rawData = res.data || [];
            applyFilter();
          } else {
            alert("Gagal memuat data: " + res.message);
          }
        })
        .catch(err => {
          document.getElementById('tableBody').innerHTML = '<tr><td colspan="10" class="text-center text-danger py-4">Gagal terhubung ke Apps Script Server!</td></tr>';
        });
    }

    function applyFilter() {
      const sumber = document.getElementById("filterSumber").value;
      const kriteria = document.getElementById("filterKriteria").value;
      const rentang = document.getElementById("filterTanggal").value;
      const search = document.getElementById("filterSearch").value.toLowerCase().trim();

      let filtered = rawData.filter(item => {
        if (currentTab === "REKAP" && sumber !== "SEMUA" && item.sumber_sheet !== sumber) return false;

        if (rentang !== "SEMUA" && item.timestamp) {
          const itemDate = new Date(item.timestamp);
          const now = new Date();
          const diffDays = (now - itemDate) / (1000 * 3600 * 24);
          if (rentang === "1_MINGGU" && diffDays > 7) return false;
          if (rentang === "2_MINGGU" && diffDays > 14) return false;
          if (rentang === "3_MINGGU" && diffDays > 21) return false;
          if (rentang === "1_BULAN" && diffDays > 30) return false;
        }

        if (search !== "") {
          if (kriteria === "ODP") return (item.odp || "").toLowerCase().includes(search);
          if (kriteria === "POP") return (item.pop || "").toLowerCase().includes(search);
          if (kriteria === "NAMA") return (item.nama_lama || "").toLowerCase().includes(search);
          if (kriteria === "CID") return (item.cid_lama || "").toLowerCase().includes(search);
          if (kriteria === "PERANGKAT") {
            return (item.sn || "").toLowerCase().includes(search) || (item.psn || "").toLowerCase().includes(search);
          }
          return (
            (item.odp || "").toLowerCase().includes(search) ||
            (item.pop || "").toLowerCase().includes(search) ||
            (item.nama_lama || "").toLowerCase().includes(search) ||
            (item.cid_lama || "").toLowerCase().includes(search) ||
            (item.sn || "").toLowerCase().includes(search) ||
            (item.psn || "").toLowerCase().includes(search)
          );
        }
        return true;
      });

      renderTable(filtered);
    }

    function renderTable(data) {
      document.getElementById("totalCount").innerText = data.length;
      const header = document.getElementById("tableHeader");
      const body = document.getElementById("tableBody");

      if (currentTab === "REKAP") {
        header.innerHTML = `
          <th>Status</th><th>Timestamp</th><th>Nama</th><th>CID</th><th>Paket</th>
          <th>Alamat</th><th>No HP</th><th>ODP</th><th>POP</th><th>Sales</th>
        `;
        if (data.length === 0) {
          body.innerHTML = '<tr><td colspan="10" class="text-center py-4">Data tidak ditemukan.</td></tr>';
          return;
        }
        body.innerHTML = data.map(row => `
          <tr>
            <td><span class="badge ${row.sumber_sheet === 'SUDAH DIAMBIL' ? 'bg-success' : 'bg-warning text-dark'}">${row.sumber_sheet}</span></td>
            <td>${row.timestamp || '-'}</td>
            <td class="fw-bold text-info">${row.nama_lama || '-'}</td>
            <td>${row.cid_lama || '-'}</td>
            <td>${row.paket || '-'}</td>
            <td>${row.alamat || '-'}</td>
            <td>${row.nohp || '-'}</td>
            <td>${row.odp || '-'}</td>
            <td>${row.pop || '-'}</td>
            <td>${row.sales || '-'}</td>
          </tr>
        `).join('');
      } else {
        header.innerHTML = `
          <th>Timestamp</th><th>Nama</th><th>CID</th><th>ODP</th><th>POP</th>
          <th>SN Unit</th><th>P-SN</th><th>Foto Rumah</th><th>Foto Alat</th><th>Ket</th>
        `;
        if (data.length === 0) {
          body.innerHTML = '<tr><td colspan="10" class="text-center py-4">Data Perangkat kosong.</td></tr>';
          return;
        }
        body.innerHTML = data.map(row => `
          <tr>
            <td>${row.timestamp || '-'}</td>
            <td class="fw-bold text-info">${row.nama_lama || '-'}</td>
            <td>${row.cid_lama || '-'}</td>
            <td>${row.odp || '-'}</td>
            <td>${row.pop || '-'}</td>
            <td class="text-warning">${row.sn || '-'}</td>
            <td class="text-warning">${row.psn || '-'}</td>
            <td>${row.foto_rumah_url ? `<a href="${row.foto_rumah_url}" target="_blank"><img src="${row.foto_rumah_url}" class="img-preview"></a>` : '-'}</td>
            <td>${row.foto_alat_url ? `<a href="${row.foto_alat_url}" target="_blank"><img src="${row.foto_alat_url}" class="img-preview"></a>` : '-'}</td>
            <td>${row.keterangan || '-'}</td>
          </tr>
        `).join('');
      }
    }

    function resetFilter() {
      document.getElementById("filterSumber").value = "SEMUA";
      document.getElementById("filterKriteria").value = "SEMUA";
      document.getElementById("filterTanggal").value = "SEMUA";
      document.getElementById("filterSearch").value = "";
      applyFilter();
    }

    function startCameraScan() {
      document.getElementById('scannerModal').classList.remove('d-none');
      html5QrCode = new Html5Qrcode("reader");
      html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: 250 },
        qrCodeMessage => {
          document.getElementById("filterSearch").value = qrCodeMessage;
          applyFilter();
          stopCameraScan();
        },
        errorMessage => {}
      );
    }

    function stopCameraScan() {
      if (html5QrCode) {
        html5QrCode.stop().then(() => {
          document.getElementById('scannerModal').classList.add('d-none');
        });
      }
    }
  </script>
</body>
</html>
